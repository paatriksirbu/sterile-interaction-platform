<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Feed</title>


  <link rel="stylesheet" href="../css/live_feed.css">
  <link rel="stylesheet" href="../css/hand-tracking.css">
  <link rel="stylesheet" href="../css/fontawesome-local.css">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">


  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


  <script src="https://www.youtube.com/iframe_api"></script>


</head>


<body>


  <div id="pinch-cursor" aria-hidden="true">
    <div class="ring"></div>
    <div class="fill"></div>
    <div class="dot"></div>
  </div>


  <div class="hand-tracking-hud" id="hand-tracking-hud">
    <div class="hud-header">
      <span class="hud-title"><i class="fa-solid fa-hand"></i> Hand Tracking</span>
      <span class="hud-status" id="hud-status">
        <span class="status-indicator"></span>
        <span>Active</span>
      </span>
    </div>
    <div class="hud-metric">
      <span class="hud-metric-label"><i class="fa-solid fa-ruler"></i> Distance</span>
      <span class="hud-metric-value" id="hud-distance">--</span>
    </div>
    <div class="hud-metric">
      <span class="hud-metric-label"><i class="fa-solid fa-bullseye"></i> Confidence</span>
      <span class="hud-metric-value" id="hud-confidence">--</span>
    </div>
    <div class="warmup-progress" id="warmup-progress">
      <div class="warmup-label">
        <span>Warmup</span>
        <span id="warmup-percent">0%</span>
      </div>
      <div class="warmup-bar">
        <div class="warmup-fill" id="warmup-fill" style="width: 0%"></div>
      </div>
    </div>
    <div class="stability-indicator" id="stability-indicator"></div>
  </div>


  <div class="gesture-feedback-badge" id="gesture-feedback-badge">
    <i class="fa-solid fa-hand-pointer"></i>
    <span id="gesture-feedback-text">Pinch detected</span>
  </div>


  <div class="app">
    <aside id="video-selector" class="video-selector">
      <h3>Seleccionar Video</h3>


      <div class="video-source-tabs">
        <button class="tab-btn active" data-tab="local">Local</button>
        <button class="tab-btn" data-tab="youtube">YouTube</button>
      </div>


      <div class="tab-content" id="tab-local">
        <div class="video-list" id="local-videos">
          <!-- Videos locales se cargarán aquí -->
        </div>
        <input type="file" id="video-file-input" accept="video/*" style="display:none">
        <button class="upload-btn" id="btn-upload-video">📁 Cargar Video</button>
      </div>


      <div class="tab-content hidden" id="tab-youtube">
        <input type="text" id="youtube-url" placeholder="Pegar URL de YouTube..." class="youtube-input">
        <button class="load-btn" id="btn-load-youtube">▶ Cargar</button>
      </div>
    </aside>


    <main id="col-work">
      <div id="workarea">
        <canvas id="overlay"></canvas>


        <div id="video-player-container">
          <video id="main-video" playsinline></video>


          <div id="youtube-container" class="hidden">
            <div id="youtube-player"></div>
          </div>


          <div id="gesture-zones">
            <div class="gesture-zone zone-left" data-action="rewind">
              <div class="zone-feedback">
                <div class="ripple-container">
                  <svg class="zone-icon" viewBox="0 0 24 24">
                    <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" />
                  </svg>
                  <span class="zone-text">10</span>
                </div>
              </div>
            </div>
            <div class="gesture-zone zone-center" data-action="playpause">
              <div class="zone-feedback play-icon">
                <svg class="zone-icon-lg" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z" />
                </svg>
              </div>
              <div class="zone-feedback pause-icon hidden">
                <svg class="zone-icon-lg" viewBox="0 0 24 24">
                  <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
              </div>
            </div>
            <div class="gesture-zone zone-right" data-action="forward">
              <div class="zone-feedback">
                <div class="ripple-container">
                  <svg class="zone-icon" viewBox="0 0 24 24">
                    <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
                  </svg>
                  <span class="zone-text">10</span>
                </div>
              </div>
            </div>
          </div>


          <div id="volume-indicator" class="hidden">
            <svg class="vol-icon" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
            </svg>
            <div class="volume-bar">
              <div class="volume-fill"></div>
            </div>
            <span class="volume-value">100%</span>
          </div>
        </div>


        <div id="camera-container">
          <video class="input_video" style="inset:0; opacity:0; visibility:hidden" muted></video>
        </div>
      </div>


      <div id="video-controls">
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-buffer"></div>
            <div class="progress-fill"></div>
            <div class="progress-handle"></div>
          </div>
        </div>


        <div class="controls-row">
          <button class="ctrl-btn" id="btn-play" title="Play/Pause">
            <svg class="icon-play" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="icon-pause hidden" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>


          <button class="ctrl-btn" id="btn-rewind" title="-10s">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
              <text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor">10</text>
            </svg>
          </button>


          <button class="ctrl-btn" id="btn-forward" title="+10s">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z" />
              <text x="12" y="15.5" font-size="7" text-anchor="middle" fill="currentColor">10</text>
            </svg>
          </button>


          <div class="volume-control">
            <button class="ctrl-btn" id="btn-mute" title="Volumen">
              <svg class="icon-vol-high" viewBox="0 0 24 24">
                <path
                  d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
              </svg>
              <svg class="icon-vol-mute hidden" viewBox="0 0 24 24">
                <path
                  d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
              </svg>
            </button>
            <input type="range" id="volume-slider" min="0" max="100" value="100">
          </div>


          <div class="time-display">
            <span id="current-time">0:00</span>
            <span class="time-sep">/</span>
            <span id="duration">0:00</span>
          </div>


          <div class="spacer"></div>


          <button class="ctrl-btn" id="btn-fullscreen" title="Pantalla completa">
            <svg class="icon-expand" viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
            </svg>
            <svg class="icon-compress hidden" viewBox="0 0 24 24">
              <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>


  <button id="btn-dashboard" class="dashboard-btn" aria-label="Go to Dashboard">
    <div class="dash-icon">📊</div>
    <div class="dash-label">Dashboard</div>
  </button>


  <div id="gesture-indicator" class="gesture-indicator">
    <span class="gesture-name">-</span>
  </div>


  <script type="module" src="../js/videoFeed/videoMain.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@6/bundles/stomp.umd.min.js"></script>
  <script src="../js/services/notificationService.js"></script>
</body>


</html>
