services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: surgical-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: surgical-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: surgical_platform
      POSTGRES_USER: surgical
      POSTGRES_PASSWORD: surgical
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgical -d surgical_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
