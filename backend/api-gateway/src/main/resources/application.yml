spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # ── Deduplicate CORS headers added by both gateway and downstream services ─
      # SockJS (notifier-service) and the gateway both emit Access-Control-Allow-Origin.
      # RETAIN_FIRST keeps the first occurrence and drops any duplicates.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # ── Global CORS ───────────────────────────────────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:63342"
              - "http://localhost:8000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600

      # ── Routes ────────────────────────────────────────────────────────────────
      routes:
        - id: gesture-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/gestures/**

        - id: session-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/sessions/**

        - id: notifier-service-rest
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**

        - id: resource-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/resources/**

        - id: speech-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/speech/**

        - id: annotation-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/annotations/**

        # WebSocket proxy for notifier-service SockJS endpoint
        - id: notifier-service-ws
          uri: http://localhost:8085
          predicates:
            - Path=/ws-notifications/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
